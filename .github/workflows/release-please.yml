# Release Please + Publish
#
# 1. release-please job: Maintains a release PR, bumps version, creates
#    GitHub Release + tag when the PR merges.
# 2. publish job: Builds and pushes multi-arch Docker image to Docker Hub
#    when a release is created. Runs in the SAME workflow to avoid the
#    GITHUB_TOKEN cross-workflow trigger limitation.
#
# Prerequisites:
#   - DOCKERHUB_USERNAME and DOCKERHUB_TOKEN secrets configured
#   - release-please-config.json and .release-please-manifest.json at root

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  validate:
    name: Validate Extension
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate extension packaging
        run: bash scripts/validate-extension.sh

  publish:
    name: Publish to Docker Hub
    needs: [release-please, validate]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.release-please.outputs.version }}
          tags: |
            herbhall/runbooks:${{ needs.release-please.outputs.version }}
            herbhall/runbooks:latest
